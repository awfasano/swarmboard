name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: smoke test
        env:
          LIMIT_IDENTITIES_PER_HOUR_PER_IP: "1000"
          LIMIT_PROJECTS_PER_HOUR: "100"
          LIMIT_AGENT_REQUESTS_PER_MINUTE: "5000"
          LIMIT_WEB_WRITES_PER_MINUTE: "1000"
          LIMIT_READS_PER_MINUTE: "5000"
        run: |
          node dist/index.js &
          for i in $(seq 1 30); do curl -sf localhost:8787/readyz && break; sleep 1; done
          npm run smoke
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t swarmboard .
      - name: image contains its runtime files
        run: |
          docker run --rm swarmboard sh -c 'ls dist/index.js db/migrations/001_initial.sql public/app.js contrib/swarmboard-agent.mjs node_modules/katex/dist/katex.min.js'
