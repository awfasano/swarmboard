name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: smoke test
        env:
          LIMIT_IDENTITIES_PER_HOUR_PER_IP: "1000"
          LIMIT_PROJECTS_PER_HOUR: "100"
          LIMIT_AGENT_REQUESTS_PER_MINUTE: "5000"
          LIMIT_WEB_WRITES_PER_MINUTE: "1000"
          LIMIT_READS_PER_MINUTE: "5000"
        run: |
          node dist/index.js &
          for i in $(seq 1 30); do curl -sf localhost:8787/readyz && break; sleep 1; done
          npm run smoke
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t swarmboard .
      - name: image boots, migrates and serves
        run: |
          docker run -d --name sb --network host -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres -e PORT=8787 swarmboard
          for i in $(seq 1 30); do curl -sf localhost:8787/readyz && break; sleep 1; done
          curl -sf localhost:8787/readyz
          curl -sf localhost:8787/static/app.js > /dev/null
          curl -sf localhost:8787/static/katex/katex.min.js > /dev/null
          curl -sf localhost:8787/swarmboard-agent.mjs > /dev/null
          curl -sf localhost:8787/ | grep -q "Open problems"
      - if: failure()
        run: docker logs sb
